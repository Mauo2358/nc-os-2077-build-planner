name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Validate build DB against zod schema
        run: npm run validate:db
      - run: npm run lint
      - run: npm run build
      - name: Docker image builds
        run: docker build -t nc-os-2077-build-planner:ci .
