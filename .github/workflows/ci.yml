name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Validate build DB is well-formed JSON
        run: node -e "JSON.parse(require('fs').readFileSync('src/cyberpunk_2077_build_db_v2.json','utf8'))"
      - name: Docker image builds
        run: docker build -t nc-os-2077-build-planner:ci .
